<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" fill="none" role="img" aria-label="Illustrative timeline of agent runtime continuity in omne-harness-lite. Session, agent runtime, model runtime and tool runtime run on separate lifecycles above a journal. At M0 the request and its intent are saved to the journal and model call m-17 starts. A write is established at M1 and kept. At M4 the agent runtime process (pid 4182) is killed with SIGKILL; the session, the in-flight model call and the journal carry on. A replacement process (pid 5307) reads the journal, reclaims the original responsibility and re-attaches to the same call by its original reference, without re-issuing it. The result is read, materials are saved and then acknowledged. The replacement submits an effect once; a notification about it is lost, so the agent re-reads the original source, and since the outcome cannot be established it stays unknown. tryFinish is the single terminal commit, then the runtime goes idle."><title>omne-harness-lite: agent runtime continuity</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.s{font-family:-apple-system,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.a{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.gx{transform-box:fill-box;transform-origin:left}.pop{transform-box:fill-box;transform-origin:center}@keyframes k0{0%,7%{opacity:0;transform:scale(.3)}8.5%,100%{opacity:1;transform:scale(1)}}@keyframes k1{0%,16%{opacity:0;transform:scale(.3)}17.5%,100%{opacity:1;transform:scale(1)}}@keyframes k2{0%,46.5%{opacity:0;transform:scale(.3)}48%,100%{opacity:1;transform:scale(1)}}@keyframes k3{0%,49.5%{opacity:0;transform:scale(.3)}51%,100%{opacity:1;transform:scale(1)}}@keyframes k4{0%,69.5%{opacity:0;transform:scale(.3)}71%,100%{opacity:1;transform:sca