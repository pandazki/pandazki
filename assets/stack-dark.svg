<svg xmlns="http://www.w3.org/2000/svg" width="880" height="198" viewBox="0 0 880 198" fill="none" role="img" aria-label="Two Pneuma repositories, one lane each. pneuma-craft: content as a tree of variants; the agent generates, a person selects, the picked variant is placed on the composition track, and every event in the log names its actor, human or agent. pneuma-framework: a governed, fail-closed loop from create through preview, draft, verify, propose and apply to publish; verify blocks a change once, then passes; apply waits for a person; rollback is always available."><title>pneuma-craft and pneuma-framework</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.s{font-family:-apple-system,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.a{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-fill-mode:both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.gx{transform-box:fill-box;transform-origin:left}.pop{transform-box:fill-box;transform-origin:center}@keyframes k0{0%,2.86%{opacity:0;transform:scale(.3)}5.36%,100%{opacity:1;transform:scale(1)}}@keyframes k1{0%,8.57%{stroke-dashoffset:66.3}12.86%,100%{stroke-dashoffset:0}}@keyframes k2{0%,11.43%{opacity:0;transform:scale(.3)}13.93%,23.57%{opacity:1;transform:scale(1)}26.43%,100%{opacity:.35;transform:scale(1)}}@keyframes k3{0%,9.43%{stroke-dashoffset:62.6}13.71%,100%{stroke-dashoffset:0}}@keyframes k4{0%,12.29%{opacity:0;transform:scale(.3)}14.79%,100%{opacity:1;transform:scale(1)}}@keyframes k5{0%,10.29%{stroke-dashoffset:66.3}14.57%,100%{stroke-dashoffset:0}}@keyframes k6{0%,13.14%{opacity:0;transform:scale(.3)}15.64%,23.57%{opacity:1;transform:scale(1)}26.43%,100%{opacity:.35;transform:scale(1)}}@keyframes k7{0%,22.86%{opacity:0;transform:scale(.3)}25.36%,100%{opacity:1;transform:scale(1)}}@keyframes k8{0%,31.43%{stroke-dashoffset:60.4}35.71%,100%{stroke-dashoffset:0}}@keyframes k9{0%,34.29%{opacity:0;transform:scale(.3)}36.79%,45%{opacity:1;transform:scale(1)}47.86%,100%{opacity:.35;transform:scale(1)}}@keyframes ka{0%,32.29%{stroke-dashoffset:60.4}36.57%,100%{stroke-dashoffset:0}}@keyframes kb{0%,35.14%{opacity:0;transform:scale(.3)}37.64%,100%{opacity:1;transform:scale(1)}}@keyframes kc{0%,44.29%{opacity:0;transform:scale(.3)}46.79%,100%{opacity:1;transform:scale(1)}}@keyframes kd{0%,52.86%{stroke-dashoffset:221}57.86%,100%{stroke-dashoffset:0}}@keyframes ke{0%,57.14%{transform:scaleX(0)}61.43%,100%{transform:scaleX(1)}}@keyframes kf{0%,2.86%{opacity:0}3.93%,7.5%{opacity:1}8.57%,100%{opacity:0}}@keyframes kg{0%,8.57%{opacity:0}9.64%,21.79%{opacity:1}22.86%,100%{opacity:0}}@keyframes kh{0%,22.86%{opacity:0}23.93%,30.36%{opacity:1}31.43%,100%{opacity:0}}@keyframes ki{0%,31.43%{opacity:0}32.5%,43.21%{opacity:1}44.29%,100%{opacity:0}}@keyframes kj{0%,44.29%{opacity:0}45.36%,51.79%{opacity:1}52.86%,100%{opacity:0}}@keyframes kk{0%,52.86%{opacity:0}53.93%,100%{opacity:1}}@keyframes kl{0%,30%{opacity:0}31.07%,38.57%{opacity:1}39.64%,100%{opacity:0}}@keyframes km{0%,30.71%{opacity:0}32.14%,40%{opacity:1}41.43%,100%{opacity:0}}@keyframes kn{0%,50%{opacity:0}51.07%,100%{opacity:1}}@keyframes ko{0%,61.43%{opacity:0}63.57%{opacity:1}65.71%{opacity:.3}67.86%{opacity:1}70%{opacity:.3}71.43%,100%{opacity:0}}@keyframes kp{0%,70.71%{opacity:0}71.79%,100%{opacity:1}}@keyframes kq{0%,62.14%{opacity:0}63.57%,72.86%{opacity:1}74.29%,100%{opacity:0}}@keyframes kr{0%,75.71%{opacity:0;transform:scale(.3)}78.21%,100%{opacity:1;transform:scale(1)}}@keyframes ks{0%{transform:translateX(382px);opacity:0}2.14%{transform:translateX(382px);opacity:1}6.43%{transform:translateX(382px);opacity:1}11.43%{transform:translateX(457px);opacity:1}14.29%{transform:translateX(457px);opacity:1}19.29%{transform:translateX(532px);opacity:1}21.43%{transform:translateX(532px);opacity:1}25.71%{transform:translateX(607px);opacity:1}32.86%{transform:translateX(607px);opacity:1}37.86%{transform:translat